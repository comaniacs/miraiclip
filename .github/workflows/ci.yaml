name: CI

# Runs on pull requests only. A merge to main is not tested again: the PR
# already ran on the same code, and re-running it on every merge used up the
# Actions minutes. Run it by hand from the Actions tab (Run workflow) after a
# direct push to main if you want a check.
on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "plan/**"
      - ".changeset/**"
      - "examples/gallery/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The "Version Packages" PR only bumps versions and changelogs.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  e2e:
    name: Golden-frame e2e (WebCodecs + Pixi in headless Chromium)
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter miraiclip-playground exec playwright install --with-deps chromium

      - name: Run golden-frame tests
        run: pnpm --filter miraiclip-playground e2e

      - name: Stage kit browser suite (layout and pixels)
        run: |
          MIRAICLIP_BROWSER="$(pnpm --filter miraiclip-playground exec node -e 'console.log(require("playwright").chromium.executablePath())')" \
            pnpm --filter @miraiclip/renderer test:browser

      - name: Server export integration (headless Chromium)
        run: |
          MIRAICLIP_BROWSER="$(pnpm --filter miraiclip-playground exec node -e 'console.log(require("playwright").chromium.executablePath())')" \
            pnpm --filter @miraiclip/server-export test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/playground/test-results/
          retention-days: 7
