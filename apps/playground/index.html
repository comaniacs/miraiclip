<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miraiclip Playground</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #101014; color: #e8e8ec;
        font-family: system-ui, sans-serif;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0; }
      #stage { width: 100%; height: auto; border: 1px solid #2a2a33; border-radius: 8px; background: #000; }
      #controls { display: flex; gap: 12px; align-items: center; }
      button { padding: 6px 18px; border-radius: 6px; border: 1px solid #3a3a46;
               background: #1c1c24; color: inherit; cursor: pointer; font-size: 14px; }
      button:hover { background: #26262f; }
      input[type="range"] { width: 360px; }
      select { padding: 6px 8px; border-radius: 6px; border: 1px solid #3a3a46;
               background: #1c1c24; color: inherit; font-size: 13px; }
      #status { font-size: 13px; color: #9a9aa6; font-variant-numeric: tabular-nums; }
      #range-label { font-size: 12px; color: #8fd18f; font-variant-numeric: tabular-nums; }
      #mark-in, #mark-out, #range-clear { padding: 6px 10px; font-size: 13px; }
      #unsupported { color: #ff7a7a; }
      /* Quick-test side panel */
      #layout { display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; padding: 0 16px; box-sizing: border-box; }
      #panel { width: 210px; flex: none; background: #16161c; border: 1px solid #2a2a33;
               border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
      .panel-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
      .panel-tabs button { flex: 1 1 45%; padding: 5px 4px; font-size: 12px; border-radius: 5px;
                           border: 1px solid transparent; background: transparent; color: #9a9aa6; }
      .panel-tabs button.active { background: #26262f; color: #e8e8ec; border-color: #3a3a46; }
      .panel-body { display: flex; flex-direction: column; gap: 8px; }
      .card { display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
              text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
      .card span { font-size: 11px; color: #8a8a96; }
      .card.active { border-color: #8fd18f; background: #1d2a1d; }
      .card:disabled { opacity: 0.45; cursor: default; }
      .panel-note { margin: 0; font-size: 11px; color: #8a8a96; line-height: 1.4; }
      .panel-footer { display: flex; gap: 6px; margin-top: 4px; }
      .panel-footer button { flex: 1; padding: 5px; font-size: 12px; }
      #panel.wide { width: 300px; }
      .fx-controls { display: flex; gap: 6px; }
      .fx-controls input, .fx-controls select { min-width: 0; flex: 1; padding: 5px 7px; border-radius: 6px;
               border: 1px solid #3a3a46; background: #1c1c24; color: inherit; font-size: 12px; }
      .fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
      .fx-tile { display: flex; flex-direction: column; padding: 0; overflow: hidden; border-radius: 7px; font-size: 10px; text-align: left; }
      .fx-tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #26262f; }
      .fx-tile span { padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #b4b4c0; }
      .fx-tile.active { border-color: #8fd18f; box-shadow: 0 0 0 1px #8fd18f; }
      .fx-tile.active span { color: #e8e8ec; }
      .fx-applied { display: flex; flex-direction: column; gap: 6px; }
      .fx-row { border: 1px solid #2a2a33; border-radius: 8px; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; }
      .fx-row.off { opacity: .55; }
      .fx-row-head { display: flex; align-items: center; gap: 4px; font-size: 12px; }
      .fx-row-head strong { flex: 1; }
      .fx-row-head button { padding: 2px 7px; font-size: 11px; }
      .fx-param { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: #8a8a96; }
      .fx-param input[type="range"] { width: 100%; }
      .fx-param input[type="color"] { width: 44px; height: 22px; padding: 0; border: 1px solid #3a3a46; background: none; }
      .au-dim { font-size: 10px; color: #8a8a96; white-space: nowrap; }
      .au-results { display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; }
      .au-item strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .au-wave { width: 100%; height: 36px; background: #101014; border-radius: 4px; }
      .au-pre { margin: 0; font-size: 10px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
                background: #101014; border: 1px solid #2a2a33; border-radius: 6px; padding: 6px; max-height: 200px; overflow: auto; }
      .au-tool-input, .au-textarea { width: 100%; box-sizing: border-box; font: 11px ui-monospace, monospace; background: #1c1c24;
                       color: inherit; border: 1px solid #3a3a46; border-radius: 6px; padding: 5px; }
      #stage-column { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; flex: 0 1 1280px; }
    </style>
  </head>
  <body>
    <h1>Miraiclip Playground — v2 preview pipeline</h1>
    <p style="margin:0;font-size:12px;color:#8a8a96">Video + audio preview — the audio clock is the playback master.</p>
    <input type="file" id="file" accept="video/*" />
    <div id="layout">
      <aside id="panel" hidden></aside>
      <div id="stage-column">
        <canvas id="stage" width="1280" height="720"></canvas>
        <div id="controls">
      <button id="play" disabled>Play</button>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled />
      <button id="mark-in" disabled title="Set export range start at the playhead">In</button>
      <button id="mark-out" disabled title="Set export range end at the playhead">Out</button>
      <span id="range-label" hidden></span>
      <button id="range-clear" hidden title="Clear the export range">✕</button>
      <select id="export-format" disabled>
        <option value="webm">WebM (VP9)</option>
        <option value="mp4">MP4 (H.264)</option>
      </select>
      <select id="export-quality" disabled>
        <option value="high" selected>High</option>
        <option value="standard">Standard</option>
        <option value="draft">Draft</option>
      </select>
      <select id="export-fps" disabled title="Output frame rate — 30 fps halves export time for 60 fps sources">
        <option value="source" selected>Source fps</option>
        <option value="30">30 fps</option>
        <option value="24">24 fps</option>
      </select>
      <button id="export" disabled>Export</button>
      <span id="status">pick a video file</span>
        </div>
      </div>
    </div>
    <p id="unsupported" hidden>This browser has no WebCodecs — use Chrome/Edge 94+, Safari 16.4+, or Firefox 130+.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
