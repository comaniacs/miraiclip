name: Release

# Manual only: Actions tab -> Release -> Run workflow (on main).
# It used to run on every push to main, re-running the whole test suite and
# re-opening the "Version Packages" PR (which triggered CI again) each time.
#
# Releasing:
#   - With pending changesets, a run opens/updates the "Version Packages" PR.
#     Merge it, then run this workflow again to publish to npm.
#   - Cheaper (one run): locally `pnpm changeset version`, commit to main,
#     then run this workflow once; with no changesets left it publishes.
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r test

      # When changesets exist: opens/updates a "Version Packages" PR.
      # When that PR is merged (no changesets left): publishes to npm.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url writes an .npmrc that reads
          # NODE_AUTH_TOKEN — without this line the publish runs
          # unauthenticated and fails, while local `pnpm release` works.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
