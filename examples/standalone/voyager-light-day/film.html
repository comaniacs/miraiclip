<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>One Light-Day</title>
<style>
  :root { --paper: #f2ede2; --ink: #f4efe6; --gold: #e9c37a; --stamp: #ff8a2a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #020205; font-family: 'Baskerville', 'Georgia', serif; color: var(--ink); }
  #stars { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; }

  /* prints: the photo-album look */
  .print { position: absolute; left: 0; top: 0; background: var(--paper); padding: 16px 16px 70px; border-radius: 3px;
    box-shadow: 0 2px 0 rgba(255,255,255,.4) inset, 0 40px 70px rgba(0,0,0,.65), 0 8px 18px rgba(0,0,0,.5); will-change: transform; }
  .print .win { position: relative; overflow: hidden; background: #000; }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.06) saturate(.92) sepia(.1); transform-origin: 50% 50%; }
  .print .cap { position: absolute; left: 22px; right: 22px; bottom: 14px; font-family: 'Bradley Hand', 'Noteworthy', cursive; font-size: 33px; color: #2b2a33; white-space: nowrap; overflow: hidden; }
  .print .cap small { font-size: 22px; color: #7a6f62; margin-left: 10px; }
  .print .stamp { position: absolute; right: 14px; bottom: 10px; font-family: 'Menlo', monospace; font-weight: 700; font-size: 26px; letter-spacing: 2px;
    color: var(--stamp); text-shadow: 0 0 6px rgba(255,120,30,.9), 0 0 16px rgba(255,90,0,.5); opacity: .92; }
  .print .gloss { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.18), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08)); pointer-events: none; }

  /* type */
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; text-shadow: 0 2px 30px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6); }
  .line em { font-style: italic; color: var(--gold); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .12em; margin-bottom: -.12em; }
  .w > span { display: inline-block; will-change: transform; }
  .s-md { font-size: 64px; letter-spacing: -.5px; }
  .s-lg { font-size: 118px; letter-spacing: -2px; line-height: 1.1; }
  .s-sm { font-size: 44px; color: #d9d2c4; }
  .mono { font-family: 'Menlo', monospace; letter-spacing: 6px; text-transform: uppercase; font-size: 22px; color: #a9b4c8; }

  #dot { position: absolute; left: 960px; top: 540px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #d8ecff; box-shadow: 0 0 10px 3px rgba(150,200,255,.9), 0 0 50px 14px rgba(90,150,255,.35); }
  #ring { position: absolute; inset: 0; }

  #hud { position: absolute; inset: 0; font-family: 'Menlo', monospace; color: #c7d2e4; }
  #hud .year { position: absolute; right: 70px; bottom: 54px; font-size: 30px; letter-spacing: 8px; }
  #hud .year b { color: var(--stamp); font-weight: 700; text-shadow: 0 0 10px rgba(255,120,30,.7); }
  #hud .km { position: absolute; left: 70px; bottom: 54px; font-size: 26px; letter-spacing: 4px; }
  #hud .km b { color: #fff; font-weight: 700; }
  #hud .tag { position: absolute; left: 70px; top: 54px; font-size: 18px; letter-spacing: 7px; color: #8e9ab0; }
  #hud .rec { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #ff3b30; margin-right: 14px; box-shadow: 0 0 10px #ff3b30; vertical-align: 1px; }

  #credit { position: absolute; left: 0; right: 0; bottom: 118px; text-align: center; font-family: 'Menlo', monospace; font-size: 17px; letter-spacing: 4px; color: #77839a; text-transform: uppercase; }

  /* film stock: grain, light leak, vignette, flash, letterbox */
  #grain { position: absolute; inset: -64px; opacity: .13; mix-blend-mode: overlay; pointer-events: none; }
  #leak { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(ellipse 55% 75% at 0% 20%, rgba(255,120,40,.85), rgba(255,60,20,.25) 45%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 100% 90%, rgba(255,190,90,.55), transparent 70%); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.72) 100%); }
  #flash { position: absolute; inset: 0; background: #fff8ec; pointer-events: none; }
  .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; }
  #barT { top: 0; } #barB { bottom: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars" width="1920" height="1080"></canvas>
  <div id="scenes" class="layer"></div>
  <div id="dot"></div>
  <svg id="ring" viewBox="0 0 1920 1080"><circle cx="960" cy="540" r="70" fill="none" stroke="#e9c37a" stroke-width="3" stroke-linecap="round" transform="rotate(-90 960 540)"/></svg>
  <div id="type" class="layer"></div>
  <div id="hud">
    <div class="tag"><span class="rec"></span><span class="tagtxt">VOYAGER 1 · LIVE</span></div>
    <div class="km"><b class="kmv">0</b> KM FROM HOME</div>
    <div class="year">YEAR <b class="yv">1977</b></div>
  </div>
  <div id="credit">Images: NASA / JPL-Caltech &nbsp;·&nbsp; Voyager 1 reaches one light-day from Earth in November 2026</div>
  <div id="leak"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="512" height="512"></canvas>
  <div id="flash"></div>
  <div id="barT" class="bar"></div><div id="barB" class="bar"></div>
</div>
<script src="timing.js"></script>
<script src="film.js"></script>
</body>
</html>
