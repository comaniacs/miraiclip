{{- /* The product demo: an editor built with Miraiclip, start to export.
       {{< demo-video >}}                  controls, click to play (with sound)
       {{< demo-video autoplay="true" >}}  muted autoplay loop (landing page) */ -}}
{{- $auto := eq (.Get "autoplay") "true" -}}
<figure id="demo" class="mc-demo">
  <video
    controls playsinline preload="metadata"
    {{ if $auto }}autoplay muted loop{{ end }}
    poster="{{ "media/miraiclip-demo-poster.jpg" | relURL }}"
    aria-label="Demo: building a launch video in an editor made with Miraiclip">
    <source src="{{ "media/miraiclip-demo.mp4" | relURL }}" type="video/mp4">
    <source src="{{ "media/miraiclip-demo.webm" | relURL }}" type="video/webm">
    <a href="{{ "media/miraiclip-demo.mp4" | relURL }}">Download the demo video (MP4)</a>
  </video>
  <figcaption>
    {{- with .Get "caption" }}{{ . | markdownify }}{{ else -}}
    An editor built with Miraiclip: start from a template, layer designed text, edit its HTML, add music, re-theme the whole UI, export.{{ if $auto }} Unmute for sound.{{ end -}}
    {{- end -}}
  </figcaption>
</figure>
<style>
  .mc-demo { margin: 0 0 2.5rem; }
  .mc-demo video {
    display: block; width: 100%; aspect-ratio: 16 / 9; background: #0b0d10;
    border-radius: 16px; border: 1px solid rgba(127, 127, 127, 0.25);
    box-shadow: 0 30px 80px -30px rgba(13, 148, 136, 0.45), 0 12px 30px -18px rgba(0, 0, 0, 0.6);
  }
  .mc-demo figcaption { margin-top: 0.75rem; font-size: 0.875rem; opacity: 0.7; text-align: center; }
</style>
